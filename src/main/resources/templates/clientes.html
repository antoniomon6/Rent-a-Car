<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head th:replace="~{layout :: head('Gestión de Clientes')}"></head>
<body>
    <nav th:replace="~{layout :: nav}"></nav>
    
    <div class="container mt-4">
        <div class="d-flex justify-content-between align-items-center mb-4">
            <h1 class="h2"><i class="bi bi-people-fill"></i> Gestión de Clientes</h1>
            <a href="/clientes/nuevo" class="btn btn-primary">
                <i class="bi bi-person-plus-fill"></i> Nuevo Cliente
            </a>
        </div>

        <div class="card shadow-sm mb-4">
            <div class="card-body">
                <div class="d-flex align-items-center">
                    <span class="me-3 fw-bold"><i class="bi bi-filter"></i> Filtros:</span>
                    <a href="/clientes/top-facturacion" class="btn btn-outline-success btn-sm me-2">
                        <i class="bi bi-graph-up-arrow"></i> Ver Top Facturación
                    </a>
                    <a href="/clientes" class="btn btn-outline-secondary btn-sm">
                        <i class="bi bi-arrow-clockwise"></i> Ver Todos
                    </a>
                </div>
                <small class="text-muted mt-2 d-block">Muestra los clientes ordenados por el gasto total en alquileres.</small>
            </div>
        </div>

        <div class="card shadow-sm">
            <div class="card-body p-0">
                <div class="table-responsive">
                    <table class="table table-striped table-hover mb-0">
                        <thead class="table-dark">
                            <tr>
                                <th>DNI</th>
                                <th>Nombre</th>
                                <th>Email</th>
                                <th>Teléfono</th>
                                <th class="text-center">Acciones</th>
                            </tr>
                        </thead>
                        <tbody>
                            <tr th:each="cliente : ${clientes}">
                                <td th:text="${cliente.dni}"></td>
                                <td th:text="${cliente.nombre}"></td>
                                <td th:text="${cliente.email}"></td>
                                <td th:text="${cliente.telefono}"></td>
                                <td class="text-center">
                                    <a th:href="@{/alquileres/historial/{dni}(dni=${cliente.dni})}" 
                                       class="btn btn-info btn-sm me-1" title="Ver Historial">
                                        <i class="bi bi-clock-history"></i>
                                    </a>
                                    <a th:href="@{/clientes/eliminar/{dni}(dni=${cliente.dni})}" 
                                       class="btn btn-danger btn-sm"
                                       sec:authorize="hasRole('ADMIN')"
                                       onclick="return confirm('¿Estás seguro de eliminar este cliente?');" title="Eliminar">
                                        <i class="bi bi-trash"></i>
                                    </a>
                                </td>
                            </tr>
                            <tr th:if="${#lists.isEmpty(clientes)}">
                                <td colspan="5" class="text-center py-4 text-muted">No hay clientes registrados.</td>
                            </tr>
                        </tbody>
                    </table>
                </div>
            </div>
        </div>
    </div>

    <footer th:replace="~{layout :: footer}"></footer>
</body>
</html>
