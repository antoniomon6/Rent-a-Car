<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Formulario de Alquiler</title>
</head>
<body>
    <nav>
        <a href="/alquileres">Alquileres</a> |
        <a href="/vehiculos">Vehículos</a> |
        <a href="/clientes">Clientes</a>
    </nav>
    <h1>Nuevo Alquiler</h1>
    
    <div th:if="${error}" th:text="${error}" style="color: red;"></div>
    
    <form th:action="@{/alquileres}" th:object="${alquiler}" method="post">
        <div>
            <label for="cliente">Cliente:</label>
            <select id="cliente" th:field="*{cliente}">
                <option th:each="c : ${clientes}" th:value="${c.dni}" th:text="${c.nombre}"></option>
            </select>
            <span th:if="${#fields.hasErrors('cliente')}" th:errors="*{cliente}">Error en cliente</span>
        </div>
        <div>
            <label for="vehiculo">Vehículo:</label>
            <select id="vehiculo" th:field="*{vehiculo}">
                <option th:each="v : ${vehiculos}" th:value="${v.matricula}" th:text="${v.modelo}"></option>
            </select>
            <span th:if="${#fields.hasErrors('vehiculo')}" th:errors="*{vehiculo}">Error en vehículo</span>
        </div>
        <div>
            <label for="fechaInicio">Fecha Inicio:</label>
            <input type="date" id="fechaInicio" th:field="*{fechaInicio}" required />
            <span th:if="${#fields.hasErrors('fechaInicio')}" th:errors="*{fechaInicio}">Error en fecha inicio</span>
        </div>
        <div>
            <label for="fechaFin">Fecha Fin:</label>
            <input type="date" id="fechaFin" th:field="*{fechaFin}" required />
            <span th:if="${#fields.hasErrors('fechaFin')}" th:errors="*{fechaFin}">Error en fecha fin</span>
        </div>
        <br>
        <button type="submit">Guardar</button>
        <a href="/alquileres">Cancelar</a>
    </form>
</body>
</html>
