<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{layout :: head('Lista de Alquileres')}"></head>
<body>
    <nav th:replace="~{layout :: nav}"></nav>
    
    <div class="container mt-4">
        <div class="d-flex justify-content-between align-items-center mb-4">
            <h1 class="h2"><i class="bi bi-calendar-check"></i> Lista de Alquileres</h1>
            <div>
                <a href="/alquileres/reportes/ingresos" class="btn btn-success me-2">
                    <i class="bi bi-graph-up"></i> Reporte Ingresos
                </a>
                <a href="/alquileres/nuevo" class="btn btn-primary">
                    <i class="bi bi-plus-circle"></i> Nuevo Alquiler
                </a>
            </div>
        </div>
        
        <div class="card shadow-sm">
            <div class="card-body p-0">
                <div class="table-responsive">
                    <table class="table table-striped table-hover mb-0">
                        <thead class="table-dark">
                            <tr>
                                <th>ID</th>
                                <th>Cliente</th>
                                <th>Vehículo</th>
                                <th>Fecha Inicio</th>
                                <th>Fecha Fin</th>
                                <th>Costo Total</th>
                                <th class="text-center">Acciones</th>
                            </tr>
                        </thead>
                        <tbody>
                            <tr th:each="alquiler : ${alquileres}">
                                <td th:text="${alquiler.id}"></td>
                                <td th:text="${alquiler.cliente.nombre}"></td>
                                <td th:text="${alquiler.vehiculo.modelo}"></td>
                                <td th:text="${#temporals.format(alquiler.fechaInicio, 'dd-MM-yyyy')}"></td>
                                <td th:text="${#temporals.format(alquiler.fechaFin, 'dd-MM-yyyy')}"></td>
                                <td th:text="${alquiler.costoTotal} + ' €'"></td>
                                <td class="text-center">
                                    <a th:if="${alquiler.vehiculo.estado.name() == 'ALQUILADO'}"
                                       th:href="@{/alquileres/devolver/{id}(id=${alquiler.id})}" 
                                       class="btn btn-warning btn-sm me-1"
                                       onclick="return confirm('¿Confirmar devolución del vehículo?');" title="Devolver Vehículo">
                                        <i class="bi bi-arrow-return-left"></i>
                                    </a>
                                    <a th:href="@{/alquileres/eliminar/{id}(id=${alquiler.id})}" 
                                       class="btn btn-danger btn-sm"
                                       onclick="return confirm('¿Estás seguro de eliminar este alquiler?');" title="Eliminar">
                                        <i class="bi bi-trash"></i>
                                    </a>
                                </td>
                            </tr>
                            <tr th:if="${#lists.isEmpty(alquileres)}">
                                <td colspan="7" class="text-center py-4 text-muted">No hay alquileres registrados.</td>
                            </tr>
                        </tbody>
                    </table>
                </div>
            </div>
        </div>
    </div>

    <footer th:replace="~{layout :: footer}"></footer>
</body>
</html>
