<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{layout :: head('Nuevo Vehículo')}"></head>
<body>
    <nav th:replace="~{layout :: nav}"></nav>
    
    <div class="container mt-5">
        <div class="row justify-content-center">
            <div class="col-md-8 col-lg-6">
                <div class="card shadow">
                    <div class="card-header bg-primary text-white">
                        <h3 class="card-title mb-0"><i class="bi bi-car-front-fill"></i> Nuevo Vehículo</h3>
                    </div>
                    <div class="card-body">
                        
                        <form th:action="@{/vehiculos}" th:object="${vehiculo}" method="post" class="needs-validation" novalidate>
                            
                            <div class="mb-3">
                                <label for="matricula" class="form-label">Matrícula</label>
                                <input type="text" id="matricula" th:field="*{matricula}" class="form-control" th:classappend="${#fields.hasErrors('matricula')} ? 'is-invalid'" required />
                                <div class="invalid-feedback" th:if="${#fields.hasErrors('matricula')}" th:errors="*{matricula}">Error en matrícula</div>
                            </div>

                            <div class="mb-3">
                                <label for="modelo" class="form-label">Modelo</label>
                                <input type="text" id="modelo" th:field="*{modelo}" class="form-control" th:classappend="${#fields.hasErrors('modelo')} ? 'is-invalid'" required />
                                <div class="invalid-feedback" th:if="${#fields.hasErrors('modelo')}" th:errors="*{modelo}">Error en modelo</div>
                            </div>

                            <div class="mb-3">
                                <label for="precioDia" class="form-label">Precio por Día (€)</label>
                                <input type="number" step="0.01" id="precioDia" th:field="*{precioDia}" class="form-control" th:classappend="${#fields.hasErrors('precioDia')} ? 'is-invalid'" required />
                                <div class="invalid-feedback" th:if="${#fields.hasErrors('precioDia')}" th:errors="*{precioDia}">Error en precio</div>
                            </div>

                            <div class="mb-3">
                                <label for="estado" class="form-label">Estado</label>
                                <select id="estado" th:field="*{estado}" class="form-select">
                                    <option th:each="estado : ${T(com.rentacar.entidades.Vehiculo.EstadoVehiculo).values()}"
                                            th:value="${estado}" th:text="${estado}"></option>
                                </select>
                            </div>

                            <div class="d-grid gap-2 d-md-flex justify-content-md-end mt-4">
                                <a href="/vehiculos" class="btn btn-secondary me-md-2">Cancelar</a>
                                <button type="submit" class="btn btn-success"><i class="bi bi-check-lg"></i> Guardar Vehículo</button>
                            </div>
                        </form>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <footer th:replace="~{layout :: footer}"></footer>
</body>
</html>
