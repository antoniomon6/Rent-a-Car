<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{layout :: head('Historial de Cliente')}"></head>
<body>
    <nav th:replace="~{layout :: nav}"></nav>
    
    <div class="container mt-4">
        <div class="d-flex justify-content-between align-items-center mb-4">
            <h1 class="h2">
                <i class="bi bi-clock-history"></i> Historial: 
                <span th:if="${cliente != null}" th:text="${cliente.nombre}"></span>
            </h1>
            <a href="/clientes" class="btn btn-secondary">Volver</a>
        </div>
        
        <div class="card shadow-sm">
            <div class="card-body p-0">
                <div class="table-responsive">
                    <table class="table table-striped table-hover mb-0">
                        <thead class="table-dark">
                            <tr>
                                <th>ID Alquiler</th>
                                <th>Vehículo</th>
                                <th>Fecha Inicio</th>
                                <th>Fecha Fin</th>
                                <th>Costo</th>
                            </tr>
                        </thead>
                        <tbody>
                            <tr th:each="alquiler : ${alquileres}">
                                <td th:text="${alquiler.id}"></td>
                                <td th:text="${alquiler.vehiculo.modelo} + ' (' + ${alquiler.vehiculo.matricula} + ')'"></td>
                                <td th:text="${#temporals.format(alquiler.fechaInicio, 'dd-MM-yyyy')}"></td>
                                <td th:text="${#temporals.format(alquiler.fechaFin, 'dd-MM-yyyy')}"></td>
                                <td th:text="${alquiler.costoTotal} + ' €'"></td>
                            </tr>
                            <tr th:if="${#lists.isEmpty(alquileres)}">
                                <td colspan="5" class="text-center py-4 text-muted">Este cliente no tiene alquileres registrados.</td>
                            </tr>
                        </tbody>
                    </table>
                </div>
            </div>
        </div>
    </div>

    <footer th:replace="~{layout :: footer}"></footer>
</body>
</html>
